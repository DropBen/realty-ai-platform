services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: realty
      POSTGRES_USER: realty
      POSTGRES_PASSWORD: local-development-only
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realty -d realty"]
      interval: 5s
      retries: 10
  migrate:
    build: .
    environment: &environment
      DATABASE_URL: postgresql+psycopg://realty:local-development-only@db:5432/realty
      APP_ENV: development
      DEMO_MODE: "true"
      APP_ORIGIN: http://localhost:8000
      AI_PROVIDER: disabled
    depends_on:
      db: {condition: service_healthy}
    command: ["python", "-m", "alembic", "upgrade", "head"]
    healthcheck: {disable: true}
  seed:
    build: .
    environment: *environment
    depends_on:
      migrate: {condition: service_completed_successfully}
    command: ["python", "-m", "realty.seed"]
    healthcheck: {disable: true}
  app:
    build: .
    environment: *environment
    depends_on:
      seed: {condition: service_completed_successfully}
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["documents:/app/data/documents"]
    restart: unless-stopped
  worker:
    build: .
    environment: *environment
    depends_on:
      seed: {condition: service_completed_successfully}
    command: ["python", "-m", "realty.jobs"]
    volumes: ["documents:/app/data/documents"]
    healthcheck: {disable: true}
    mem_limit: 1g
    cpus: 1.0
    restart: unless-stopped
volumes:
  postgres-data:
  documents:
